<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Мой первый сайт</title>
  <style>
  body {
    background-color: lightyellow; /* светло-голубой фон */
    font-family: Arial, sans-serif; /* шрифт */
    text-align: center; /* всё по центру */
    padding: 20px;
  }
  h1 {
    color: darkblue; /* тёмно-синий цвет заголовка */
  }
  p {
    color: #333333; /* цвет текста */
    font-size: 18px; /* размер текста */
  }
  button {
    color: white; /* белый текст */
    border: none; /* убрать рамку */
    padding: 12px 24px; /* отступы внутри кнопки */
    font-size: 16px;
    border-radius: 8px; /* закруглённые углы */
    margin: 5px;
  }
    .green-btn {
  background-color: green; /* зелёный фон */
}

.red-btn {
  background-color: red; /* красный фон */
}
    .green-btn:hover {
  background-color: darkgreen;
}

.red-btn:hover {
  background-color: darkred;
}
    </style>
</head>
<body>
  <h1>Привет! Я Матвей, учусь программировать</h1>
  <p>Это мой первый абзац на сайте.</p>
  <p>Хочу научиться програмировать чтобы зарабатывать, и создавать что то свое.</p>
  <button class="green-btn" onclick="alert('Ты нажал кнопку!')">Нажми меня</button>
<button class="red-btn" onclick="alert('Нет, лучше меня!')">Нет лучше меня!</button>
  
</body>
</html>
